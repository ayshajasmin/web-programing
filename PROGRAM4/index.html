<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <form aling="center">

        <table bgcolor="lightblue" align="center" cellpadding="8">

            <tr>
                <th colspan="2">Registration form</th>
            </tr>

            <tr>
                <td>Full Name</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Mobile Number</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Email id</td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td>Age</td>
                <td><input type="number"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <input type="radio" name="gender"> Others
                </td>
            </tr>

            <tr>
                <td>Date Of Birth</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Address</td>
                <td><textarea rows="6" cols="25"></textarea></td>
            </tr>

            <tr>
                <td>Current Study</td>
                <td>
                    <select>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>
                    <select>
                        <option>CS</option>
                        <option>EC</option>
                        <option>ME</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Upload CV</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>Programming Languages</td>
                <td>
                    <input type="checkbox"> HTML
                    <input type="checkbox"> Reactjs
                    <input type="checkbox"> CSS
                    <input type="checkbox"> Flutter
                </td>
            </tr>

            <tr>
                <td>Language</td>
                <td>
                    <input type="checkbox"> English
                    <input type="checkbox"> Malayalam
                    <input type="checkbox"> Arabic
                    <input type="checkbox"> Hindi
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="submit">
                </td>
                <td>
                    <input type="reset" value="reset">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
