<!doctype html>

<body>
<center>
<h2><u><font color="gold">STRING METHOD</u></h2>
</center>
<center> <p><b>java script string method
<b></p> 
<script> var name="i am Abin Abraham";
document.write(name); 
document.write("<br/>");
document.write("length of string is:",name.length);
document.write("<br/>");
document.write("index of first occurence of a in string is:",name.indexOf("a"));
document.write("<br/>");
document.write("index of last occurence of a in string is:",name.lastIndexOf("a"));
document.write("<br/>");
document.write("index of am in string:",name.search("am"));
document.write("<br/>");
document.write("index 0 to 3 print using slice:",name.slice(0,4));
document.write("<br/>");
document.write("to get substring of string using substring:",name.substring(0,8));
document.write("<br/>");
document.write("to get substring of string using substr:",name.substr(0,3));
document.write("<br/>");
document.write("string to upper case:",name.toUpperCase());
document.write("<br/>");
document.write("replace abin abraham to sweetie string:");
document.write(name.replace("Abin Abraham","sweetie"));
document.write("<br/>");
document.write("use trim:",name.trim());
document.write("<br/>");
document.write("new string that have chacter 5 on string:",name.charAt(5));
document.write("<br/>");
document.write("print numeric ASSI value of charecter 5 on string:",name.charCodeAt(5));
document.write("<br/>");
</script>
